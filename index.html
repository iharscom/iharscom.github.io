<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHARS - Mobile Games & Apps</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            padding: 36px 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin: 16px 0 24px;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: #fff;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
        }
        .btn-outline:hover {
            background: #334155;
            color: #fff;
        }
        footer {
            margin-top: 28px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Game Studio</span>
        <h1>IHARS</h1>
        <p>Welcome to the official developer portal of IHARS. We create engaging, action-packed mobile strategy games and digital experiences.</p>
        
        <div class="btn-group">
            <a class="btn" href="https://play.google.com/store/apps/details?id=com.ihars.doodlekingdoms" target="_blank">Doodle Kingdoms on Google Play</a>
            <a class="btn btn-outline" href="https://iharscom.github.io/doodle-kingdoms-privacy-policy/" target="_blank">Privacy Policy</a>
            <a class="btn btn-outline" href="/app-ads.txt" target="_blank">app-ads.txt</a>
        </div>

        <footer>
            &copy; 2026 IHARS. All rights reserved.
        </footer>
    </div>
</body>
</html>
